# 거래 비용 (설계서 8.3절).
#
# kr_quant_machine config/costs.yaml(커밋 351ec2c)의 sell_tax를 시장별로 나눠 가져왔다.
# 수수료·슬리피지는 설계서 값이고 kr_quant_machine 값(실계좌 기준)과 다르다.
#
# sell_tax: 매도 금액 대비 증권거래세 + 농어촌특별세 합계. 유가증권시장은 증권거래세 + 농특세 0.15%,
#   코스닥은 증권거래세만 낸다.
#   - 세율은 양도일(결제일) 기준으로 바뀐다. 결제는 체결 2영업일 뒤라서 여기에는 새 세율이 처음 적용되는
#     **체결일**을 적는다 (설계서 8.3 "체결일이 속한 기간·시장의 세율").
#   - 출처 (kr_quant_machine에서 2026-11-15 확인, 법령 원문이 아니라 예탁결제원·증권사 공지와 보도):
#       2019: 예탁결제원 "양도일 기준 6월 3일, 매매체결일 기준 5월 30일부터" (0.30% → 0.25%)
#       2021: 기재부 "2021년 1월 1일 양도분부터" 코스피 0.08% + 농특세 0.15%, 코스닥 0.23%
#       2023: 코스피 0.05% + 농특세 0.15%, 코스닥 0.20%
#     2021·2023년의 체결일(2020-12-29, 2022-12-28)은 공지를 찾지 못해 같은 규칙으로 계산한 값이다.
#   - verified: false인 구간은 단계 A에서 법령 원문으로 확인한다 (체크리스트 4절 "거래세표" [등록 전 필수]).
#     특히 2010~2015년 시장별 세율은 아직 확인한 출처가 없다. 아래 0.30%는 설계서 표의 "~2019-06" 값이다.
#   - 연구 기간이 2023-12-31에서 끝나므로 2024년 이후 세율은 두지 않는다.
sell_tax:
  kospi:
    - {from: "2010-01-04", rate: 0.0030, verified: false}
    - {from: "2019-05-30", rate: 0.0025, verified: false}
    - {from: "2020-12-29", rate: 0.0023, verified: false}
    - {from: "2022-12-28", rate: 0.0020, verified: false}
  kosdaq:
    - {from: "2010-01-04", rate: 0.0030, verified: false}
    - {from: "2019-05-30", rate: 0.0025, verified: false}
    - {from: "2020-12-29", rate: 0.0023, verified: false}
    - {from: "2022-12-28", rate: 0.0020, verified: false}

commission: 0.00015          # 매수·매도 각각 편도 1.5bp

# 거래대금 구간별 슬리피지 (편도). 재구성 기준일 직전 20영업일 평균 거래대금으로 유니버스 안 3분위에 배정
slippage:
  main_universe: {top: 0.0005, middle: 0.0010, bottom: 0.0020}
  sensitivity_universe: 0.0005
  delisting_liquidation: bottom   # 상장폐지 청산은 하위 구간 값
