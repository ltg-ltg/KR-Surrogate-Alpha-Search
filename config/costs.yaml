# 거래 비용 (설계서 8.3절).
#
# kr_quant_machine config/costs.yaml(커밋 351ec2c)의 sell_tax를 시장별로 나눠 가져왔다.
# 수수료·슬리피지는 설계서 값이고 kr_quant_machine 값(실계좌 기준)과 다르다.
#
# sell_tax: 매도 금액 대비 증권거래세 + 농어촌특별세 합계. 유가증권시장은 증권거래세 + 농특세 0.15%,
#   코스닥은 증권거래세만 낸다.
#   - 세율은 양도일(결제일) 기준으로 바뀐다. 결제는 체결 2영업일 뒤라서 여기에는 새 세율이 처음 적용되는
#     **체결일**을 적는다 (설계서 8.3 "체결일이 속한 기간·시장의 세율").
#   - 근거 (2026-11-20 확인, 증권거래세법 제8조 제2항·시행령 제5조 탄력세율. 시행령은 "시행 이후 양도분"부터 적용)
#       2010~2019-05: 시행령 제5조 유가증권시장 1천분의 1.5(+ 농특세 0.15%), 코스닥시장 1천분의 3.
#                     2019년 인하가 "23년 만의 인하"였으므로 연구 기간 2010~2018에는 바뀌지 않았다
#       2019-06-03 양도분: 대통령령 제29788호(2019-05-28 일부개정, 2019-06-03 시행) 유가증권 0.15% → 0.10%,
#                     코스닥 0.30% → 0.25%. 체결 2019-05-30(목) → 결제 06-03(월)
#       2021-01-01 양도분: 시행령 개정(2020-12) 2021-01-01~2022-12-31 유가증권 0.08%, 코스닥 0.23%.
#                     2020-12-31 휴장이라 체결 12-29(화) → 결제 2021-01-04
#       2023-01-01 양도분: 시행령 개정이유 "2023-01-01~12-31 유가증권 1만분의 5", 코스닥 0.20%.
#                     2022-12-30 휴장이라 체결 12-28(수) → 결제 2023-01-02
#     출처: 국가법령정보센터 증권거래세법 시행령 제정·개정이유 https://www.law.go.kr/lsRvsRsnListP.do?lsId=005028 ,
#           법무법인 율촌 2019년 개정 세법 주요 내용 https://www.leeko.com/newsl/tax/201907/tax1907_2.html ,
#           한국세정신문 2020-12 https://www.taxtimes.co.kr/news/article.html?no=247461 ,
#           KPMG 2023년 개정세법 요약 https://assets.kpmg.com/content/dam/kpmg/kr/pdf/2023/tax-brief/korea-tax-brief-202301-kor-F.pdf
#     결제일은 체결 2영업일 뒤(T+2). 휴장일(연말)은 결제일이 아니다
#   - 연구 기간이 2023-12-31에서 끝나므로 2024년 이후 세율은 두지 않는다.
#   - 값은 매도 시 내는 세금 합계다. 코스피는 증권거래세 + 농어촌특별세 0.15% (예: 2023년 0.05% + 0.15% = 0.20%)
sell_tax:
  kospi:
    - {from: "2010-01-04", rate: 0.0030, verified: true}
    - {from: "2019-05-30", rate: 0.0025, verified: true}
    - {from: "2020-12-29", rate: 0.0023, verified: true}
    - {from: "2022-12-28", rate: 0.0020, verified: true}
  kosdaq:
    - {from: "2010-01-04", rate: 0.0030, verified: true}
    - {from: "2019-05-30", rate: 0.0025, verified: true}
    - {from: "2020-12-29", rate: 0.0023, verified: true}
    - {from: "2022-12-28", rate: 0.0020, verified: true}

commission: 0.00015          # 매수·매도 각각 편도 1.5bp

# 거래대금 구간별 슬리피지 (편도). 재구성 기준일 직전 20영업일 평균 거래대금으로 유니버스 안 3분위에 배정
slippage:
  main_universe: {top: 0.0005, middle: 0.0010, bottom: 0.0020}
  sensitivity_universe: 0.0005
  delisting_liquidation: bottom   # 상장폐지 청산은 하위 구간 값
